aid: hipcamp
name: Hipcamp
description: >-
  Hipcamp is the #1 app to find and book campsites globally, with real-time availability
  across more than 500,000 sites in the United States, Canada, Australia, and the United
  Kingdom. Campers search national parks, state parks, RV resorts, and private land stays
  (farms, ranches, vineyards) in one app, with filters, Pro map layers (BLM/USFS land, cell
  coverage, dark skies), road-trip search, and free availability alerts. Hosts list and manage
  campsites, sync calendars, and take weekly payouts. Hipcamp integrates with campground
  reservation systems (ResNexus, Cloudbeds, Newbook, RMS, Bedful) but publishes no public
  developer API — /api and /graphql are internal-only. Surfaced as an a16z / Bond Capital /
  Slow Ventures portfolio company and profiled in the API Evangelist network.
